# 全店共通の設定
request_delay_sec: 4          # 同一サイトへのアクセス間隔（秒）。サイト負荷に配慮し短くしないこと
max_requests_per_store: 450   # 1店舗あたりの最大リクエスト数（4秒間隔で約30分。同じ日に取得済みのページは数えない）
max_requests_area_master: 1500 # エリアマスタ作成時の最大リクエスト数（足りない分は次回続きから）

# 全店共通の店舗設定（stores.yaml の各店舗で上書き可）
store_defaults:
  indirect_radius_km: 5
  direct_radius_km: 10
  own_match_radius_km: 0.3
  own_keywords: [ドスパラ, サードウェーブ, THIRDWAVE]

# ①自店: 自社採用サイト（店舗の自動登録時に各店舗へ設定される）
own_job_site:
  company: 株式会社サードウェーブ
  url: https://tw-saiyou.snar.jp/index.aspx?id=2BvD_nYsgcM
# ③直接競合の待遇調査（Claude のウェブ検索で Indeed・バイトル・各社公式採用ページ等を調べる）
# GitHub の Secrets に ANTHROPIC_API_KEY を登録すると有効になる（未登録なら自動でスキップ）
competitor_research:
  enabled: false        # 有料のため停止中（true にすると有効）
  model: claude-opus-5-5
  effort: medium        # low / medium / high。上げるほど丁寧だが費用増
  max_searches: 15      # 1店舗あたりのウェブ検索回数の上限
  max_fetches: 15       # 1店舗あたりのページ取得回数の上限
  max_items: 15         # 1店舗あたりの最大求人数
geocode_cache: data/geocode_cache.json
manual_jobs_csv: data/manual_jobs.csv   # Indeed・バイトル等の手入力求人

mynavi:
  # 直接競合として広域検索する職種パス（家電量販店）
  direct_occupation_paths:
    - ss-3/ssm-102
  # 30件超の大分類を中分類に分割するときの優先順（ss-3 = 販売・接客・サービス）
  drill_priority_ss: [ss-3, ss-1, ss-10, ss-13]

# ③直接競合（家電量販・パソコン関連小売）の判定ルール
direct_competitor:
  categories: [家電量販店]
  # 家電量販店で働くが販売以外の職種（警備・清掃・物流など）は直接競合に含めない
  exclude_categories: [警備, 清掃, ビル管理, 倉庫, 物流, 軽作業, ドライバー, 配送, 引越]
  brand_keywords:
    - ヨドバシ
    - ビックカメラ
    - コジマ
    - ソフマップ
    - エディオン
    - EDION
    - 100満ボルト
    - ジョーシン
    - Joshin
    - 上新電機
    - ケーズデンキ
    - ヤマダ電機
    - ヤマダデンキ
    - テックランド
    - ベスト電器
    - ノジマ
    - PC DEPOT
    - ピーシーデポ
    - パソコン工房
    - ユニットコム
    - グッドウィル
    - ツクモ
    - TSUKUMO
    - じゃんぱら
    - イオシス
    - PCワンズ
    - パソコンショップアーク
  title_keywords:
    - 家電量販
    - 家電販売
    - 家電製品
    - 家電売場
    - パソコン販売
    - PC販売
    - PCショップ
    - パソコンショップ
    - パソコン専門店
    - PC専門店
    - PCパーツ
    - パソコン修理
    - PC修理
    - PC組立
    - パソコン組立
    - ゲーミングPC
  # 仕事内容（本文）での判定は誤検知しやすいので「販売業務」が明確な表現に限定
  content_keywords:
    - 家電量販店での販売
    - 家電量販店の販売
    - 家電量販店内での販売
    - 家電製品の販売
    - パソコンの販売
    - PCの販売
    - パソコンショップ
    - PCショップ
    - PCパーツ
    - ゲーミングPC
