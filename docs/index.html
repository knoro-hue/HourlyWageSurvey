<!doctype html>
<html lang="ja">
<head>
<meta http-equiv="refresh" content="0; url=dospara-namba/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>時給調査ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500&display=swap">
<style>
  :root { --fg:#1d2733; --muted:#5b6775; --line:#dbe3ec; --panel:rgba(255,255,255,.92); --accent:#2f6fb3; }
  * { box-sizing: border-box; }
  body { margin:0; color:var(--fg); font-family:"Noto Sans JP", system-ui, sans-serif; font-size:15px;
    background-color: #f6f9fc; background-image: linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,.75)), url("assets/bg.svg"); background-size: cover; background-position: center top; background-attachment: fixed; min-height:100vh; }
  main { max-width:1100px; margin:0 auto; padding:48px max(16px,3vw); display:grid; gap:24px; }
  h1 { font-family:"Shippori Mincho", serif; font-weight:500; font-size:2rem; margin:0; }
  p { margin:0; color:var(--muted); }
  .cards { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr)); }
  .card { display:grid; gap:8px; padding:20px; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; }
  .card:hover, .card:focus-visible { border-color:var(--accent); outline:none; }
  .name { font-weight:700; font-size:1.1rem; }
  .date { font-size:.85rem; color:var(--muted); }
  .kv { display:flex; justify-content:space-between; gap:12px; font-size:.9rem; border-top:1px solid var(--line); padding-top:6px; }
  .kv b { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>時給調査ダッシュボード</h1>
  <p>採用向けに、店舗周辺のアルバイト時給を毎週月曜に自動で集計しています。店舗を選ぶと詳細を表示します。</p>
  <section class="cards">
<a class="card" href="dospara-namba/"><span class="name">ドスパラ大阪・なんば店</span><span class="date">調査日 2026-11-06</span><span class="kv"><span>① 自店</span><b>1,250円</b></span><span class="kv"><span>③ 直接競合 中央値</span><b>1,500円</b></span><span class="kv"><span>② 間接競合 中央値</span><b>1,400円</b></span></a>
  </section>
</main>
</body>
</html>
