name: 時給調査（定期実行）

on:
  schedule:
    # 毎週日曜 02:17 JST（= 土曜 17:17 UTC）に全店を調査。店舗グループごとに順番に実行し、日曜の昼頃までに完了
    - cron: "17 17 * * 6"
    # 毎月2日 03:23 JST：店舗一覧とエリアマスタを更新
    - cron: "23 18 1 * *"
  workflow_dispatch:
    inputs:
      task:
        description: "実行内容"
        type: choice
        options: [survey, sync-stores, build-areas, setup-all]
        default: survey
      shard:
        description: "survey の対象（all＝全店 / 0〜6＝店舗グループ番号）"
        required: false
        default: all
      store:
        description: "店舗IDを指定する場合（空欄なら曜日で選ぶ）"
        required: false
        default: ""
      max_requests:
        description: "1店舗あたり最大リクエスト数（空欄で設定値）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: wage-survey
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      task: ${{ steps.p.outputs.task }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          TASK: ${{ github.event.inputs.task }}
          SHARD: ${{ github.event.inputs.shard }}
          STORE: ${{ github.event.inputs.store }}
        run: |
          task="${TASK:-survey}"
          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHED" = "23 18 1 * *" ]; then task=setup; else task=survey; SHARD=all; fi
          fi
          if [ "$task" = "setup-all" ]; then task=setup-all; fi
          shards='["today"]'
          if [ -n "$STORE" ]; then shards='["store"]'
          elif [ "$SHARD" = "all" ] || [ "$task" = "setup-all" ]; then shards='["0","1","2","3","4","5","6"]'
          elif [ -n "$SHARD" ]; then shards="[\"$SHARD\"]"; fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "task=$task shards=$shards"

  setup:
    needs: plan
    if: needs.plan.outputs.task == 'sync-stores' || needs.plan.outputs.task == 'build-areas' || needs.plan.outputs.task == 'setup' || needs.plan.outputs.task == 'setup-all'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 店舗一覧を更新
        if: needs.plan.outputs.task != 'build-areas'
        run: python -m wage_survey.main --sync-stores
      - name: エリアマスタを更新
        if: needs.plan.outputs.task != 'sync-stores'
        run: python -m wage_survey.main --build-areas
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/stores.yaml data
          git diff --cached --quiet && exit 0
          git commit -m "店舗一覧・エリアマスタ更新 $(TZ=Asia/Tokyo date +%F)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 10; done

  survey:
    needs: [plan, setup]
    if: always() && needs.plan.result == 'success' && (needs.setup.result == 'success' || needs.setup.result == 'skipped') && (needs.plan.outputs.task == 'survey' || needs.plan.outputs.task == 'setup-all')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      max-parallel: 1          # 求人サイトへの負荷を増やさないため1つずつ実行
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - run: git pull --rebase origin "${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: 単体テスト
        run: python -m pytest -q tests
      - name: 時給調査を実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SHARD: ${{ matrix.shard }}
          STORE: ${{ github.event.inputs.store }}
          MAXREQ: ${{ github.event.inputs.max_requests }}
        run: |
          args=()
          if [ "$SHARD" = "store" ]; then args+=(--store "$STORE"); else args+=(--shard "$SHARD"); fi
          if [ -n "$MAXREQ" ]; then args+=(--max-requests "$MAXREQ"); fi
          python -m wage_survey.main "${args[@]}"
      - name: 結果をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports docs data/geocode_cache.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "時給調査レポート $(TZ=Asia/Tokyo date +%F) shard=${{ matrix.shard }}"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 15
          done
