name: probe
on:
  workflow_dispatch:
  push:
    paths: ['probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python probe/probe.py probe/urls.txt
      - name: push results to probe-out branch
        run: |
          cd out
          git init -q -b probe-out
          git config user.name github-actions; git config user.email actions@github.com
          git add -A; git commit -qm "probe $GITHUB_RUN_ID"
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} probe-out
