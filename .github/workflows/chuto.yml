name: 中途採用 年収相場の集計

# data/doda/ に CSV がアップロードされたら集計して docs/chuto/ を更新する。
# doda にはアクセスしない（ネット接続は勤務地のジオコーディングのみ）。
# 毎週の時給調査（concurrency group: wage-survey-run）とは別グループなので待たせない。
on:
  push:
    branches: [main]
    paths:
      - "data/doda/**"
      - "config/chuto.yaml"
      - "wage_survey/chuto.py"
      - "wage_survey/templates/chuto/**"
  schedule:
    # 毎週月曜 05:43 JST：確認日から90日を過ぎた求人を外すため再集計
    - cron: "43 20 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chuto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: 単体テスト
        run: python -m pytest -q tests
      - name: 集計してページを更新
        run: python -m wage_survey.chuto
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chuto data/geocode_cache.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "中途採用 年収相場を更新 $(TZ=Asia/Tokyo date '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && break
            fi
            sleep 15
          done
