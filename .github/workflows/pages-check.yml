name: ページ表示チェック
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "" index.html docs/ docs/index.html docs/stores.json docs/dospara-namba/ docs/assets/bg.svg docs/data/stores.csv; do
            for base in https://knoro-hue.github.io/HourlyWageSurvey/ https://knoro-hue.github.io/hourlywagesurvey/; do
              echo "$(curl -s -o /dev/null -w '%{http_code}' "$base$u") $base$u"
            done
          done
          curl -s https://knoro-hue.github.io/HourlyWageSurvey/ | head -12
