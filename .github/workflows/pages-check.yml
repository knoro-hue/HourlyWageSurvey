name: ページ表示チェック
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "" stores.json dospara-namba/ dospara-sendai/ assets/bg.svg data/stores.csv docs/ docs/dospara-namba/; do
            for base in https://knoro-hue.github.io/HourlyWageSurvey/; do
              echo "$(curl -s -o /dev/null -w '%{http_code}' "$base$u") $base$u"
            done
          done
          curl -s https://knoro-hue.github.io/HourlyWageSurvey/docs/dospara-namba/ | head -3
