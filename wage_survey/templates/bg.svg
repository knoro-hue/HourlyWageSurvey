<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f1fb"/><stop offset="1" stop-color="#f7fafd"/></linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9c3a5"/><stop offset="1" stop-color="#c4a882"/></linearGradient>
    <linearGradient id="suitA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5578"/><stop offset="1" stop-color="#2a3f5c"/></linearGradient>
    <linearGradient id="suitB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a9e"/><stop offset="1" stop-color="#3b6f82"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>
  <!-- window -->
  <g transform="translate(1040 90)">
    <rect width="440" height="420" rx="10" fill="#cfe3f5"/>
    <rect x="12" y="12" width="416" height="396" rx="6" fill="#eaf4fd"/>
    <path d="M12 300 C120 250 220 280 300 240 S420 230 428 220 V408 H12Z" fill="#cde4d4"/>
    <rect x="12" y="12" width="416" height="396" fill="url(#light)"/>
    <rect x="216" y="12" width="8" height="396" fill="#cfe3f5"/>
    <rect x="12" y="206" width="416" height="8" fill="#cfe3f5"/>
  </g>
  <rect x="1000" y="80" width="520" height="460" fill="url(#light)" opacity=".5" filter="url(#blur)"/>
  <!-- plant -->
  <g transform="translate(150 470)">
    <path d="M60 0 C20 -80 30 -150 70 -200 C80 -140 90 -80 60 0Z" fill="#7fb38d"/>
    <path d="M60 0 C100 -70 140 -110 190 -120 C150 -70 110 -30 60 0Z" fill="#94c4a0"/>
    <path d="M60 0 C10 -40 -30 -60 -70 -60 C-30 -20 10 0 60 0Z" fill="#6fa47e"/>
    <path d="M10 0 H110 L95 120 H25Z" fill="#e7d9c6"/>
  </g>
  <!-- wall frame: org chart -->
  <g transform="translate(330 140)" opacity=".85">
    <rect width="300" height="200" rx="8" fill="#ffffff" stroke="#d3deea" stroke-width="3"/>
    <rect x="125" y="28" width="50" height="30" rx="6" fill="#bcd2ea"/>
    <path d="M150 58 V90 M70 90 H230 M70 90 V112 M150 90 V112 M230 90 V112" stroke="#bcd2ea" stroke-width="4" fill="none"/>
    <rect x="45" y="112" width="50" height="30" rx="6" fill="#d6e5f4"/>
    <rect x="125" y="112" width="50" height="30" rx="6" fill="#d6e5f4"/>
    <rect x="205" y="112" width="50" height="30" rx="6" fill="#d6e5f4"/>
  </g>
  <!-- chair backs -->
  <rect x="430" y="470" width="170" height="250" rx="40" fill="#8aa0b8"/>
  <rect x="1000" y="470" width="170" height="250" rx="40" fill="#8aa0b8"/>
  <!-- interviewer (left) -->
  <g>
    <path d="M440 760 C440 600 470 540 560 520 C650 540 680 600 680 760Z" fill="url(#suitA)"/>
    <path d="M540 522 L560 600 L580 522Z" fill="#ffffff"/>
    <path d="M556 530 L560 590 L564 530Z" fill="#c45b5b"/>
    <rect x="538" y="470" width="44" height="60" rx="18" fill="#f1cfb4"/>
    <circle cx="560" cy="430" r="62" fill="#f3d6bd"/>
    <path d="M498 425 C495 365 535 352 560 352 C600 352 628 372 622 425 C612 395 590 385 560 386 C530 387 506 398 498 425Z" fill="#3a3330"/>
  </g>
  <!-- candidate (right) -->
  <g>
    <path d="M920 760 C920 600 950 540 1040 520 C1130 540 1160 600 1160 760Z" fill="url(#suitB)"/>
    <path d="M1020 522 L1040 590 L1060 522Z" fill="#ffffff"/>
    <rect x="1018" y="470" width="44" height="60" rx="18" fill="#efc9aa"/>
    <circle cx="1040" cy="430" r="60" fill="#f1d0b3"/>
    <path d="M978 440 C968 370 1010 350 1040 350 C1085 350 1112 380 1104 440 C1100 420 1092 402 1080 396 C1060 410 1020 412 990 404 C984 414 980 426 978 440Z" fill="#5a3f2e"/>
  </g>
  <!-- handshake -->
  <path d="M640 600 C700 610 740 615 790 615" stroke="#2a3f5c" stroke-width="46" stroke-linecap="round" fill="none"/>
  <path d="M960 600 C900 610 860 615 812 615" stroke="#3b6f82" stroke-width="46" stroke-linecap="round" fill="none"/>
  <ellipse cx="800" cy="615" rx="42" ry="26" fill="#f1cfb4"/>
  <path d="M772 606 C790 598 812 598 830 608" stroke="#d9b294" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- desk -->
  <rect x="300" y="680" width="1000" height="40" rx="10" fill="url(#desk)"/>
  <rect x="300" y="718" width="1000" height="182" fill="#e9dccb"/>
  <!-- papers on desk -->
  <g transform="translate(470 640) rotate(-6)">
    <rect width="150" height="46" rx="4" fill="#ffffff" stroke="#d8dde4" stroke-width="2"/>
    <rect x="12" y="10" width="24" height="26" rx="3" fill="#cbd8e6"/>
    <rect x="46" y="12" width="90" height="5" rx="2" fill="#cbd3dc"/>
    <rect x="46" y="22" width="70" height="5" rx="2" fill="#cbd3dc"/>
    <rect x="46" y="32" width="80" height="5" rx="2" fill="#cbd3dc"/>
  </g>
  <g transform="translate(1010 646)">
    <rect width="150" height="38" rx="4" fill="#5c6b7c"/>
    <rect x="-14" y="34" width="178" height="10" rx="4" fill="#8794a3"/>
  </g>
  <rect x="880" y="650" width="34" height="34" rx="6" fill="#ffffff" stroke="#d8dde4" stroke-width="2"/>
  <!-- floating wage cards -->
  <g transform="translate(110 120)" opacity=".9">
    <rect width="170" height="110" rx="14" fill="#ffffff" stroke="#d6e2ee" stroke-width="2"/>
    <text x="22" y="62" font-family="sans-serif" font-size="44" font-weight="700" fill="#9db7d4">¥</text>
    <rect x="70" y="34" width="76" height="8" rx="4" fill="#d6e2ee"/>
    <rect x="70" y="52" width="56" height="8" rx="4" fill="#d6e2ee"/>
    <rect x="70" y="70" width="66" height="8" rx="4" fill="#d6e2ee"/>
  </g>
  <g transform="translate(720 150)" opacity=".85">
    <rect width="180" height="120" rx="14" fill="#ffffff" stroke="#d6e2ee" stroke-width="2"/>
    <rect x="28" y="70" width="22" height="30" rx="3" fill="#c7d9ec"/>
    <rect x="62" y="52" width="22" height="48" rx="3" fill="#b3cbe6"/>
    <rect x="96" y="38" width="22" height="62" rx="3" fill="#9db7d4"/>
    <rect x="130" y="24" width="22" height="76" rx="3" fill="#86a6c9"/>
  </g>
</svg>
